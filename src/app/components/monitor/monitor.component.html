<div class="monitor">
  <div class="monitor__chart">
      <components-design-chart [options]="chartOptions()" [locale]="translationService.locale()"></components-design-chart>
  </div>

  <form class="monitor__filter" [formGroup]="rangeForm">
    <label class="monitor__filter-label" for="range">
      <i class="pi pi-calendar"></i>
      {{'monitor.dateRange.label' | translate}}
    </label>

    <p-datepicker
      inputId="range"
      formControlName="range"
      selectionMode="range"
      [showIcon]="true"
      iconDisplay="input"
      dateFormat="yy-mm-dd"
      [placeholder]="'monitor.dateRange.placeholder' | translate"
    />
  </form>
</div>
