<ng-template #navLinks>
  @if(isLogin()){
  @for (item of navItems; track item.path) {
  <a class="nav__link" [routerLink]="item.path" routerLinkActive="nav__link--active" (click)="closeMobileMenu()">
    {{ item.label }}
  </a>
  }
  }
</ng-template>

<header class="nav">
  <div class="nav__bar">
    <span class="nav__brand"><app-icon name="temperature" /><app-icon name="pressure" /></span>

    <nav class="nav__links nav__links--desktop">
      <ng-container [ngTemplateOutlet]="navLinks" />
    </nav>

    <button pButton type="button" class="nav__burger" [text]="true" icon="pi pi-bars" (click)="toggleMobileMenu()"
      aria-label="Open menu"></button>
  </div>
</header>

<p-drawer [visible]="isMobileMenuOpen()" (visibleChange)="onDrawerVisibleChange($event)" position="right"
  [header]="'nav.menuHeader' | translate">
  
  <app-language-switcher justifyContent="end"/>

  <nav class="nav__links nav__links--mobile">
    <ng-container [ngTemplateOutlet]="navLinks" />
  </nav>

  @if (isLogin()) {
  <p class="nav__username">{{ 'nav.signedInAs' | translate }} {{ username() }}</p>
  <button pButton type="button" [label]="'nav.logout' | translate" severity="secondary" class="nav__logout-mobile"
    (click)="logout(); closeMobileMenu()"></button>
  }
</p-drawer>
