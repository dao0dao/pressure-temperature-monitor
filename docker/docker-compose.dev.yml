services:
  app:
    container_name: frontend-monitor-app
    image: frontend-monitor-app

    build:
      context: ..
      dockerfile: docker/dockerfile

    ports:
      - "4200:4200"

    volumes:
      - ..:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    command: ["npx", "ng", "serve", "--host", "0.0.0.0"]